; GrokChan firmware for M5Stack CoreS3 + Stack-chan (Arduino framework + M5Unified).
;   pio run -e cores3                 build the firmware
;   pio run -e cores3 -t upload       flash
;   pio device monitor                serial log (USB CDC)
;   pio test -e native                host unit tests (no hardware needed)

[platformio]
default_envs = cores3

[env:cores3]
platform = espressif32@^6.9.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -Wno-unused-variable
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  m5stack/M5Unified@^0.2.2
  links2004/WebSockets@^2.6.1
  bblanchon/ArduinoJson@^7.2.0

; Host tests of the hardware-free core (lib/grokchan_core). Needs a C++17 compiler (g++/clang++).
[env:native]
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
  -Wall
  -Wno-unused-variable
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
lib_ignore =
  M5Unified
  M5GFX
  WebSockets
