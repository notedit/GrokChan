<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>GrokChan face preview</title>
<!--
  Desktop preview of the CoreS3 character UI. It draws the primitives (polygon fans, ellipses, rings)
  that gc::FaceAnimator produced in tools/preview/face_dump.cpp, i.e. the same frames the device
  rasterises in src/platform/pf_display.h. Differences to the device: canvas anti-aliasing, and the
  subtitle font (browser CJK font instead of efontCN). Generate the data first: run_preview.sh
  Views (query string):  ?view=live (default)  |  ?view=grid&set=states|exprs|layouts|strips  |
                         ?view=single&set=states&name=idle&s=2
-->
<style>
  html, body { margin: 0; background: #07080b; color: #cfd3dc; font: 13px/1.3 -apple-system, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
  body { padding: 0; box-sizing: border-box; }
  .cell { display: inline-block; vertical-align: top; margin: 0 8px 8px 8px; }
  .cell canvas { display: block; background: #0d0f14; border: 1px solid #2a2f3a; border-radius: 6px; }
  .cap { text-align: center; padding: 4px 0 0; color: #aab; font-size: 13px; }
  h1 { font-size: 15px; margin: 8px 12px; color: #e8e8ee; font-weight: 600; }
  .row { white-space: nowrap; }
  .live { padding: 12px; }
  button { background: #1b2030; color: #dde; border: 1px solid #343b50; border-radius: 6px; padding: 5px 10px; margin: 0 4px 6px 0; cursor: pointer; }
  button.on { background: #3a4a7a; }
  #bar { height: 6px; background: #1b2030; border-radius: 3px; margin-top: 6px; }
  #bar i { display: block; height: 6px; width: 0; background: #7aa2ff; border-radius: 3px; }
</style>
</head>
<body>
<script src="dist/preview_data.js"></script>
<script src="face_draw.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const VIEW = Q.get('view') || 'live';

const { hex, drawFrame, drawBox } = GCFaceDraw;   // shared with tools/webdevice (face_draw.js)

function cell(parent, w, h, caption, s) {
  const d = document.createElement('div'); d.className = 'cell';
  const c = document.createElement('canvas');
  c.width = Math.round(w * s); c.height = Math.round(h * s);
  d.appendChild(c);
  if (caption) { const cp = document.createElement('div'); cp.className = 'cap'; cp.textContent = caption; d.appendChild(cp); }
  parent.appendChild(d);
  return c.getContext('2d');
}

function setSize(w, h) { document.body.dataset.w = w; document.body.dataset.h = h; }

// --- views ---------------------------------------------------------------------------------
function viewSingle() {
  const set = Q.get('set') || 'states', name = Q.get('name'), s = parseFloat(Q.get('s') || '2');
  const item = FACE[set].find(x => x.name === name);
  const ctx = cell(document.body, 320, 240, null, s);
  document.body.querySelector('.cell').style.margin = '0';
  document.body.querySelector('canvas').style.border = 'none';
  document.body.querySelector('canvas').style.borderRadius = '0';
  drawFrame(ctx, item.frame, s);
  if (item.box) drawBox(ctx, item, s);
  setSize(Math.round(320 * s), Math.round(240 * s));
}

function viewGrid() {
  const set = Q.get('set') || 'states', s = parseFloat(Q.get('s') || '1');
  const titles = {
    states: 'GrokChan 回合状态：idle / listening / thinking / speaking（320x240，gc_face 同源渲染）',
    exprs: 'GrokChan 全部表情（setExpression 叠加层，基础状态=idle；最后一格为 listening + love 叠加）',
    layouts: 'GrokChan 字幕布局：角色缩小让位（speaking；字幕在上 / 中 / 下）',
    strips: 'GrokChan 状态切换过渡（每行：切换后 0 / 100 / 200 / 350 / 600 / 1000 ms）',
  };
  const h1 = document.createElement('h1'); h1.textContent = titles[set]; document.body.appendChild(h1);
  const wrap = document.createElement('div'); wrap.style.padding = '0 4px 4px'; document.body.appendChild(wrap);
  let cols, items;
  if (set === 'strips') {
    const ss = s * 0.5;
    FACE.strips.forEach(st => {
      const t = document.createElement('div'); t.className = 'cap'; t.style.textAlign = 'left'; t.style.margin = '4px 10px 0'; t.textContent = st.label;
      wrap.appendChild(t);
      const row = document.createElement('div'); row.className = 'row'; wrap.appendChild(row);
      st.frames.forEach(fr => { const ctx = cell(row, 320, 240, '+' + fr.t + ' ms', ss); drawFrame(ctx, fr.frame, ss); });
    });
    const w = 6 * (320 * ss + 18) + 12;
    setSize(Math.ceil(w), Math.ceil(wrap.getBoundingClientRect().bottom + window.scrollY + 8));
    return;
  }
  items = FACE[set]; cols = set === 'states' ? 4 : set === 'layouts' ? 3 : 4;
  let row;
  items.forEach((it, i) => {
    if (i % cols === 0) { row = document.createElement('div'); row.className = 'row'; wrap.appendChild(row); }
    const ctx = cell(row, 320, 240, it.label || it.name, s);
    drawFrame(ctx, it.frame, s);
    if (it.box) drawBox(ctx, it, s);
  });
  const w = cols * (320 * s + 18) + 12;
  setSize(Math.ceil(w), Math.ceil(wrap.getBoundingClientRect().bottom + window.scrollY + 8));
}

function viewLive() {
  const root = document.createElement('div'); root.className = 'live'; document.body.appendChild(root);
  const h = document.createElement('h1'); h.style.margin = '0 0 8px'; h.textContent = 'GrokChan 角色界面预览（gc_face 同源帧；非真机）'; root.appendChild(h);
  const bar = document.createElement('div'); root.appendChild(bar);
  const ctx = cell(root, 320, 240, null, 2);
  const lab = document.createElement('div'); lab.className = 'cap'; lab.style.fontSize = '16px'; root.appendChild(lab);
  const prog = document.createElement('div'); prog.id = 'bar'; prog.innerHTML = '<i></i>'; root.appendChild(prog);
  const modes = { turn: '回合状态时间轴', expr: '表情时间轴' };
  let mode = 'turn', i = 0;
  const btns = {};
  Object.keys(modes).forEach(k => {
    const b = document.createElement('button'); b.textContent = modes[k]; b.onclick = () => { mode = k; i = 0; mark(); }; bar.appendChild(b); btns[k] = b;
  });
  function mark() { Object.keys(btns).forEach(k => btns[k].classList.toggle('on', k === mode)); }
  mark();
  let last = 0;
  function loop(ts) {
    const A = FACE.anim[mode];
    if (ts - last >= 1000 / A.fps) {
      last = ts;
      drawFrame(ctx, A.frames[i], 2);
      let seg = A.segs[0]; for (const sg of A.segs) if (sg.from <= i * 1000 / A.fps) seg = sg;
      lab.textContent = seg.label;
      prog.firstChild.style.width = (100 * i / A.frames.length) + '%';
      i = (i + 1) % A.frames.length;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

({ single: viewSingle, grid: viewGrid, live: viewLive }[VIEW] || viewLive)();
</script>
</body>
</html>
