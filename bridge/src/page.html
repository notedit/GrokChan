<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>GrokChan Chat</title>
<style nonce="__NONCE__">
:root{--bg:#f6f7f9;--panel:#fff;--text:#1b1f24;--muted:#6b7280;--border:#e3e6ea;--me:#2563eb;--me-text:#fff;--bot:#eef0f3;--accent:#2563eb;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0e1013;--panel:#161a1f;--text:#e8eaed;--muted:#8b94a1;--border:#262c34;--me:#3b6fe0;--me-text:#fff;--bot:#212730;--accent:#6c9bff;--err:#ff8a80}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:820px;margin:0 auto;background:var(--panel);border-left:1px solid var(--border);border-right:1px solid var(--border)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--border)}
header h1{font-size:16px;margin:0;font-weight:600}
.actions{display:flex;gap:8px}
button{font:inherit;cursor:pointer}
.btn{background:transparent;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:14px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.empty{margin:auto;color:var(--muted);text-align:center;font-size:14px}
.msg{max-width:86%;padding:9px 13px;border-radius:14px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--me);color:var(--me-text);border-bottom-right-radius:4px}
.msg.user a{color:var(--me-text)}
.msg.assistant{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.msg.error{align-self:center;background:transparent;color:var(--err);font-size:14px;text-align:center}
.msg a{color:var(--accent);text-decoration:underline}
.thinking{align-self:flex-start;color:var(--muted);font-size:14px;padding:4px 6px}
.dots span{display:inline-block;animation:blink 1.2s infinite both}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
form.compose{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--border)}
textarea{flex:1;resize:none;max-height:160px;min-height:42px;padding:9px 12px;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:12px;outline:none}
textarea:focus,input:focus{border-color:var(--accent)}
.send{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:0 18px;height:42px;font-weight:600}
.send:disabled{opacity:.5;cursor:not-allowed}
#login{display:none;margin:auto;padding:24px;width:min(340px,92%);text-align:center}
#login h2{margin:0 0 4px;font-size:18px}
#login .send{width:100%}
#login input{width:100%;padding:10px 12px;margin:12px 0;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:10px;outline:none}
#login p.err{color:var(--err);min-height:1.4em;margin:0 0 8px;font-size:14px}
body.locked #log,body.locked form.compose,body.locked .actions .chat-only{display:none}
body.locked #login{display:block}
</style>
</head>
<body class="locked">
<div class="app">
  <header>
    <h1>GrokChan Chat</h1>
    <div class="actions">
      <button class="btn chat-only" id="newChat" type="button">New chat</button>
    </div>
  </header>
  <div id="login">
    <h2>Enter passcode</h2>
    <input id="passcode" type="password" autocomplete="current-password" placeholder="Passcode" aria-label="Passcode">
    <p class="err" id="loginErr"></p>
    <button class="send" id="loginBtn" type="button">Enter</button>
  </div>
  <main id="log" aria-live="polite"></main>
  <form class="compose" id="form" autocomplete="off">
    <textarea id="input" rows="1" placeholder="Message… Enter to send, Shift+Enter for newline" aria-label="Message"></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
</div>
<script nonce="__NONCE__">
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var log = $("log"), input = $("input"), sendBtn = $("send");
  var SID_KEY = "gc_session";
  var sid = null, lastId = 0, waiting = false, pollTimer = null, thinkingEl = null, seen = {};
  var POLL_MS = 1500;
  var MAX_WAIT_MS = 11 * 60 * 1000;
  var waitStarted = 0;

  function newSid() {
    var a = new Uint8Array(16); crypto.getRandomValues(a);
    var s = ""; for (var i = 0; i < a.length; i++) s += ("0" + a[i].toString(16)).slice(-2);
    return "s_" + s;
  }
  function getSid() {
    try { sid = localStorage.getItem(SID_KEY); } catch (e) { sid = null; }
    if (!sid || !/^[A-Za-z0-9_-]{8,64}$/.test(sid)) { sid = newSid(); try { localStorage.setItem(SID_KEY, sid); } catch (e) {} }
    return sid;
  }
  function api(method, path, body) {
    var opt = { method: method, credentials: "same-origin", headers: {} };
    if (body !== undefined) { opt.headers["content-type"] = "application/json"; opt.body = JSON.stringify(body); }
    return fetch(path, opt).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, data: j }; });
    });
  }

  // Plain text -> DOM with clickable http(s) links. Never uses innerHTML for message text.
  function render(el, text) {
    var re = /https?:\/\/[^\s\u0080-\uFFFF<>"'`]+/g, last = 0, m;
    while ((m = re.exec(text))) {
      var url = m[0], trail = "";
      var t = /[.,;:!?)\]}]+$/.exec(url);
      if (t) { trail = t[0]; url = url.slice(0, url.length - trail.length); }
      if (m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)));
      var a = document.createElement("a");
      a.href = url; a.textContent = url; a.target = "_blank"; a.rel = "noopener noreferrer nofollow";
      el.appendChild(a);
      last = m.index + url.length;
      re.lastIndex = last;
    }
    if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
  }
  function clearEmpty() { var e = log.querySelector(".empty"); if (e) e.remove(); }
  function showEmpty() {
    log.textContent = "";
    var d = document.createElement("div"); d.className = "empty"; d.textContent = "Say hello — chat with your Grok Bot through GrokChan.";
    log.appendChild(d);
  }
  function scroll() { log.scrollTop = log.scrollHeight; }
  function addMsg(role, text) {
    clearEmpty();
    var d = document.createElement("div"); d.className = "msg " + role;
    render(d, text); log.appendChild(d); scroll(); return d;
  }
  function setThinking(on) {
    if (on && !thinkingEl) {
      thinkingEl = document.createElement("div"); thinkingEl.className = "thinking";
      thinkingEl.innerHTML = 'Thinking<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
      log.appendChild(thinkingEl); scroll();
    } else if (!on && thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
  }
  function setWaiting(on) {
    waiting = on; sendBtn.disabled = on; setThinking(on);
    clearTimeout(pollTimer);
    if (on) { waitStarted = Date.now(); pollTimer = setTimeout(poll, POLL_MS); }
  }
  function addTurn(t) {
    if (seen[t.id]) return; seen[t.id] = true;
    if (t.id > lastId) lastId = t.id;
    addMsg(t.role, t.text);
    if (thinkingEl) log.appendChild(thinkingEl);
  }

  function poll() {
    if (!waiting) return;
    var mySid = sid;
    api("GET", "/api/poll?session_id=" + encodeURIComponent(mySid) + "&after=" + lastId).then(function (r) {
      if (mySid !== sid || !waiting) return;
      if (r.status === 401) { lock(); return; }
      if (r.status === 200) {
        var got = r.data.turns || [];
        got.forEach(addTurn);
        if (got.length) { setWaiting(false); return; }
        if (!r.data.pending || Date.now() - waitStarted > MAX_WAIT_MS) {
          setWaiting(false); addMsg("error", "No reply (timed out). Please try again."); return;
        }
      }
      pollTimer = setTimeout(poll, POLL_MS);
    }, function () { if (waiting) pollTimer = setTimeout(poll, POLL_MS * 2); });
  }

  function send() {
    var text = input.value.trim();
    if (!text || waiting) return;
    input.value = ""; autosize();
    addMsg("user", text);
    setWaiting(true);
    api("POST", "/api/chat", { session_id: sid, message: text }).then(function (r) {
      if (r.status === 202) return;
      setWaiting(false);
      if (r.status === 401) { lock(); return; }
      var m = { 429: "Too many messages. Please wait a moment.", 413: "Message too long.", 502: "Grok Bot did not accept this message (webhook failed). Try again later.", 500: "Server is not configured yet. Check deploy settings." }[r.status];
      addMsg("error", m || ("Send failed (" + r.status + ")."));
    }, function () { setWaiting(false); addMsg("error", "Network error. Send failed."); });
  }

  function loadHistory() {
    seen = {}; lastId = 0; log.textContent = ""; thinkingEl = null;
    return api("GET", "/api/history?session_id=" + encodeURIComponent(sid)).then(function (r) {
      if (r.status === 401) { lock(); return; }
      var turns = (r.status === 200 && r.data.turns) || [];
      if (!turns.length) showEmpty();
      turns.forEach(function (t) { seen[t.id] = true; if (t.id > lastId) lastId = t.id; addMsg(t.role, t.text); });
      if (r.status === 200 && r.data.pending) setWaiting(true);
    });
  }

  function lock() {
    setWaiting(false); document.body.classList.add("locked"); $("passcode").focus();
  }
  function unlock() {
    document.body.classList.remove("locked"); $("loginErr").textContent = "";
    getSid(); return loadHistory().then(function () { input.focus(); });
  }
  function login() {
    var pc = $("passcode").value;
    if (!pc) return;
    api("POST", "/api/login", { passcode: pc }).then(function (r) {
      if (r.status === 200) { $("passcode").value = ""; unlock(); }
      else $("loginErr").textContent = r.status === 429 ? "Too many attempts. Try again in a minute." : "Incorrect passcode.";
    }, function () { $("loginErr").textContent = "Network error."; });
  }

  function newChat() {
    var old = sid;
    setWaiting(false);
    api("POST", "/api/reset", { session_id: old });
    sid = newSid(); try { localStorage.setItem(SID_KEY, sid); } catch (e) {}
    seen = {}; lastId = 0; showEmpty(); input.focus();
  }

  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); send(); }
  });
  $("form").addEventListener("submit", function (e) { e.preventDefault(); send(); });
  $("newChat").addEventListener("click", newChat);
  $("loginBtn").addEventListener("click", login);
  $("passcode").addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); login(); } });

  getSid();
  api("GET", "/api/session").then(function (r) { if (r.status === 200) unlock(); else lock(); }, lock);
})();
</script>
</body>
</html>
